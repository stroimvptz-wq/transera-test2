.offline-note{background:#def6f0;padding:15px 25px;color:#235e51;font-size:13px}main{max-width:1450px;margin:auto;padding:24px}</style></head><body><div class="offline-note">Автономный редактор документов. Интернет не нужен. Черновики из сайта переносятся через «Копия черновика» → «Импорт черновика». Скачивайте JSON-копии: хранение данных локальных HTML-файлов зависит от браузера.</div><main id="content"></main><script>let currentUser={email:'offline'};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random();function render(){document.getElementById('content').innerHTML=documentsPage();}let localDirectoryOpen=false;
function localDirectoryKey(){return 'transera-directory:'+String(currentUser?.email||'guest').toLowerCase();}
function localDirectoryRead(){try{const x=JSON.parse(localStorage.getItem(localDirectoryKey())||'{"records":[],"defaultId":null}');return {records:Array.isArray(x.records)?x.records:[],defaultId:x.defaultId||null};}catch{return {records:[],defaultId:null};}}
function localDirectoryWrite(x){localStorage.setItem(localDirectoryKey(),JSON.stringify(x));}
const localPartyFields=[['name','Наименование организации / ФИО'],['kind','Тип (ООО, ИП, физлицо, водитель)'],['inn','ИНН'],['kpp','КПП'],['ogrn','ОГРН / ОГРНИП'],['address','Юридический / почтовый адрес'],['bank','Банк'],['bik','БИК'],['correspondent','Корреспондентский счёт'],['account','Расчётный счёт'],['director','Руководитель / подписант'],['basis','Действует на основании'],['phone','Телефон'],['email','Электронная почта'],['vehicle','Автомобиль, госномер'],['license','Водительское удостоверение']];
function localDirectoryEditor(){
 const db=localDirectoryRead();
 return '<div class="card section"><h3>Справочник реквизитов</h3><div class="actions"><button class="btn secondary" type="button" data-dir-export>Скачать резервную копию</button><label class="btn secondary" style="cursor:pointer">Импортировать копию <input type="file" accept="application/json,.json" data-dir-import style="display:none"></label></div><div class="local-doc-list">'+db.records.map(x=>'<div class="local-doc-record"><span><strong>'+esc(x.name||'Без названия')+'</strong> · '+esc(x.kind||'')+(x.id===db.defaultId?' · <strong>Моя компания</strong>':'')+'</span><div class="actions"><button type="button" class="btn secondary" data-dir-edit="'+esc(x.id)+'">Изменить</button><button type="button" class="btn secondary" data-dir-default="'+esc(x.id)+'">Сделать моей</button><button type="button" class="btn secondary" data-dir-delete="'+esc(x.id)+'">Удалить</button></div></div>').join('')+'</div><form id="local-directory-form"><h3 id="local-directory-heading">Добавить реквизиты</h3><input type="hidden" name="id" value=""><div class="fields">'+localPartyFields.map(([k,l])=>'<label>'+esc(l)+'<input type="text" name="'+k+'" value=""></label>').join('')+'</div><div class="actions"><button class="btn" type="submit">Сохранить реквизиты</button><button class="btn secondary" type="button" data-dir-reset>Очистить форму</button></div></form></div>';
}
function localPartyOptions(){return localDirectoryRead().records.map(x=>'<option value="'+esc(x.id)+'">'+esc(x.name||'Без названия')+' · '+esc(x.inn||x.kind||'')+'</option>').join('');}
function localPartyFill(role,id){
 const party=localDirectoryRead().records.find(x=>x.id===id),f=document.getElementById('local-document-form');if(!party||!f)return;
 const set=(key,value)=>{const el=f.elements.namedItem(key);if(el&&value)el.value=value;};
 const details=[party.address,party.ogrn?'ОГРН: '+party.ogrn:'',party.bank?'Банк: '+party.bank:'',party.bik?'БИК: '+party.bik:'',party.account?'Р/с: '+party.account:'',party.correspondent?'К/с: '+party.correspondent:'',party.phone?'Тел.: '+party.phone:''].filter(Boolean).join('; ');
 if(role==='self'){set('seller',party.name);set('sellerDetails',details);set('sellerInn',[party.inn,party.kpp].filter(Boolean).join('/'));set('bank',party.bank);set('bik',party.bik);set('account',party.account);set('correspondent',party.correspondent);set('shipper',party.name);set('sellerEntity',party.name);}
 if(role==='other'){set('buyer',party.name);set('buyerDetails',details);set('buyerInn',[party.inn,party.kpp].filter(Boolean).join('/'));set('consignee',party.name);set('customerSign',party.director);set('customerBasis',party.basis);set('buyerEntity',party.name);}
 if(role==='carrier'){set('carrier',party.name);set('carrierSign',party.director);set('carrierBasis',party.basis);set('driver',party.name+(party.license?' · ВУ '+party.license:''));set('vehicle',party.vehicle);}
}
function localPartySelectors(){const db=localDirectoryRead(),opts=localPartyOptions();return '<div class="local-party-picker"><label>Моя компания<select data-party-role="self"><option value="">Выберите компанию</option>'+opts+'</select></label><label>Контрагент<select data-party-role="other"><option value="">Выберите контрагента</option>'+opts+'</select></label><label>Перевозчик / водитель<select data-party-role="carrier"><option value="">Выберите из справочника</option>'+opts+'</select></label></div><p class="muted">При выборе реквизиты подставятся в форму. Вы можете изменить их только для этого документа.</p>';}
function localDirectoryDownload(){const blob=new Blob([JSON.stringify({version:1,directory:localDirectoryRead()},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='transera-rekvizity-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);}
function localDirectoryReset(){const f=document.getElementById('local-directory-form');if(f){f.reset();f.elements.namedItem('id').value='';}}
document.addEventListener('change',async e=>{
 if(e.target.matches('[data-party-role]')){localPartyFill(e.target.dataset.partyRole,e.target.value);return;}
 if(e.target.matches('[data-dir-import]')){
  const file=e.target.files?.[0];if(!file)return;
  try{const data=JSON.parse(await file.text()),dir=data.directory;if(!dir||!Array.isArray(dir.records)||dir.records.length>1000||dir.records.some(x=>!x||typeof x.name!=='string'||typeof x.id!=='string'))throw Error('Неверный формат файла');if(!confirm('Заменить текущий справочник данными из резервной копии?'))return;localDirectoryWrite({records:dir.records,defaultId:dir.defaultId||null});render();alert('Справочник восстановлен.');}catch(err){alert('Не удалось импортировать справочник: '+err.message);}
 }
});
document.addEventListener('submit',e=>{
 if(e.target.id!=='local-directory-form')return;e.preventDefault();
 const data=Object.fromEntries(new FormData(e.target).entries());if(!data.name?.trim()){alert('Укажите название или ФИО');return;}
 const db=localDirectoryRead();data.id=data.id||uid();const idx=db.records.findIndex(x=>x.id===data.id);if(idx>=0)db.records[idx]=data;else db.records.push(data);
 if(!db.defaultId&&db.records.length===1)db.defaultId=data.id;
 try{localDirectoryWrite(db);render();alert('Реквизиты сохранены на этом устройстве.');}catch(err){alert('Не удалось сохранить: '+err.message);}
});
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-dir-edit],[data-dir-default],[data-dir-delete],[data-dir-export],[data-dir-reset],[data-dir-toggle]');
 if(!b)return;
 if(b.hasAttribute('data-dir-toggle')){localDirectoryOpen=!localDirectoryOpen;render();return;}
 if(b.hasAttribute('data-dir-export')){localDirectoryDownload();return;}
 if(b.hasAttribute('data-dir-reset')){localDirectoryReset();return;}
 const db=localDirectoryRead(),id=b.dataset.dirEdit||b.dataset.dirDefault||b.dataset.dirDelete,party=db.records.find(x=>x.id===id);
 if(b.hasAttribute('data-dir-default')){db.defaultId=id;localDirectoryWrite(db);render();return;}
 if(b.hasAttribute('data-dir-delete')){if(!confirm('Удалить реквизиты из справочника?'))return;db.records=db.records.filter(x=>x.id!==id);if(db.defaultId===id)db.defaultId=null;localDirectoryWrite(db);render();return;}
 if(b.hasAttribute('data-dir-edit')&&party){localDirectoryOpen=true;render();const f=document.getElementById('local-directory-form');for(const [k,v] of Object.entries(party)){const el=f.elements.namedItem(k);if(el)el.value=v||'';}document.getElementById('local-directory-heading').textContent='Редактировать реквизиты';f.scrollIntoView({behavior:'smooth',block:'start'});}
});

function localDocumentKey(){return 'transera-local-documents:'+String(currentUser?.email||'guest').toLowerCase();}
function localDocumentRead(){try{const x=JSON.parse(localStorage.getItem(localDocumentKey())||'[]');return Array.isArray(x)?x:[];}catch{return [];}}
function localDocumentWrite(items){localStorage.setItem(localDocumentKey(),JSON.stringify(items));}
function localDocumentSave(data){if(!data)return;const rows=localDocumentRead(),i=rows.findIndex(x=>x.id===data.id);if(i<0)rows.unshift(data);else rows[i]=data;localDocumentWrite(rows);localDocumentId=data.id;docDirty=false;docPending=null;docStatus('Черновик сохранён на устройстве');}
function docStatus(text,error=false){const el=document.getElementById('doc-save-status');if(el){el.textContent=text;el.classList.toggle('doc-error',error);}}
function docLabel(type){return localDocumentTypes.find(x=>x[0]===type)?.[1]||'Документ';}
function docDate(){const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');}
function localFieldsFor(type){
 let base=localDocumentFields.filter(([k])=>!['quantity','unit','price','amount','vat'].includes(k));
 if(!docTransport.includes(type))base=base.filter(([k])=>!['route','vehicle','driver','subject'].includes(k));
 if(type==='waybill')base=base.filter(([k])=>!['buyer','buyerDetails','buyerInn','subject'].includes(k));
 if(type==='reconcile')base=base.filter(([k])=>!['subject'].includes(k));
 if(['tn','order','contract'].includes(type))base.push(['amount','Стоимость перевозки, ₽'],['vat','Ставка НДС']);
 if(type==='tn')base=base.map(x=>x[0]==='buyer'?['buyer','Грузополучатель']:x);
 const extras=(localExtraFields[type]||[]).concat(docExtra.common,docExtra[type]||[]);
 if(type==='upd')extras.push(...localExtraFields.vat);
 const seen=new Set();return base.concat(extras).filter(([k])=>!(type==='tn'&&k==='consignee')&&!seen.has(k)&&seen.add(k));
}

}

function docFileName(d,ext){return 'business-ai-'+d.type+'-'+String(d.number||'draft').replace(/[^a-zA-Zа-яА-ЯёЁ0-9_-]/g,'_')+'.'+ext;}
function docExample(){const f=document.getElementById('local-document-form');if(!f)return;if([...f.querySelectorAll('input[data-doc-field],textarea')].some(el=>!['date','currency','status'].includes(el.name)&&el.value.trim())&&!confirm('Заменить введённые данные вымышленным примером?'))return;
 const d={...localDocumentData(),number:'ОБРАЗЕЦ-026',date:docDate(),seller:'ООО «Альфа» (вымышленный пример)',sellerDetails:'Москва, ул. Складская, д. 10',sellerInn:'ИНН / КПП — заполните свои',buyer:'ООО «Вектор» (вымышленный пример)',buyerDetails:'Тверь, ул. Промышленная, д. 5',buyerInn:'ИНН / КПП — заполните свои',consignee:'ООО «Вектор»',shipper:'ООО «Альфа»',carrier:'ООО «ТрансЛогистик» (пример)',subject:'Бумага А4',cargoPlaces:'100',package:'Коробки',grossMass:localDocumentType==='ttn'?'0,5':'500',netMass:localDocumentType==='ttn'?'0,48':'480',loading:'Москва, ул. Складская, д. 10',unloading:'Тверь, ул. Промышленная, д. 5',deliveryAddress:'Тверь, ул. Промышленная, д. 5',route:'Москва → Тверь',routeDeadline:'Доставка по согласованной заявке',vehicle:'Грузовой автомобиль, А000АА — пример',driver:'Иванов Иван Иванович (пример)',basis:'Договор № 12 от 01.11.2026',transferBasis:'Договор № 12 от 01.11.2026',currency:'Российский рубль, 643',status:'1',amount:'25000',vat:'22%',terms:'ОБРАЗЕЦ. Все данные вымышлены. Перед использованием замените реквизиты.',acceptance:'Услуги оказаны в согласованном объёме. Замечания: отсутствуют (пример).',validFrom:docDate(),validTo:docDate(),periodStart:docDate().slice(0,8)+'01',periodEnd:docDate(),transportKind:'Перевозка грузов',trafficKind:'Междугородное',sellerSign:'Петров Пётр Петрович (пример)',buyerSign:'Сидоров Сергей Сергеевич (пример)',openingBalance:'0',openingOther:'0',operations:[{date:docDate(),document:'Акт № 12 (пример)',debit:'30500',credit:'0',otherDebit:'30500',otherCredit:'0'},{date:docDate(),document:'Платёж № 34 (пример)',debit:'0',credit:'20000',otherDebit:'0',otherCredit:'20000'}],items:[{subject:localDocumentType==='act'?'Услуги перевозки Москва — Тверь':'Бумага А4',quantity:localDocumentType==='act'?'1':'100',unit:localDocumentType==='act'?'усл.':'кор.',price:localDocumentType==='act'?'25000':'250',vat:'22%'}]};docPending=d;docDirty=true;render();docMount();docFlush();}
document.addEventListener('input',e=>{if(e.target.closest('#local-document-form'))docQueueSave();});
document.addEventListener('change',async e=>{
 if(e.target.closest('#local-document-form')){docQueueSave();if(e.target.matches('[data-party-role]'))queueMicrotask(()=>{docUpdatePreview();docFlush();});}
 if(!e.target.matches('[data-doc-import]'))return;const file=e.target.files?.[0];if(!file)return;
 try{if(file.size>2*1024*1024)throw Error('Файл больше 2 МБ');const data=JSON.parse(await file.text()),d=data.document;if(data.version!==1||!d||!localDocumentTypes.some(x=>x[0]===d.type))throw Error('Неизвестный формат черновика');if(d.items&&(!Array.isArray(d.items)||d.items.length>200))throw Error('Некорректные строки товаров');if(d.operations&&(!Array.isArray(d.operations)||d.operations.length>500))throw Error('Некорректные операции');for(const [k,v] of Object.entries(d)){if(!['items','operations'].includes(k)&&typeof v!=='string')throw Error('Некорректное поле');}for(const row of [...(d.items||[]),...(d.operations||[])]){if(!row||typeof row!=='object'||Object.values(row).some(v=>typeof v!=='string'))throw Error('Некорректная строка');}d.id=uid();localDocumentSave(d);docOpen(d.type,d.id);}catch(err){alert('Не удалось импортировать: '+err.message);}
});
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-local-doc-new],[data-local-doc-open],[data-local-doc-delete],[data-local-doc-close],[data-local-doc-print],[data-local-doc-download],[data-doc-step],[data-doc-prev],[data-doc-next],[data-doc-example],[data-doc-add-item],[data-doc-remove-item],[data-doc-json],[data-doc-add-operation],[data-doc-remove-operation]');
 if(!b){if(e.target.matches('[data-local-doc-backdrop]'))docClose();else if(docDirty&&e.target.closest('[data-page],[data-go-home],[data-go-back]'))docFlush();return;}
 if(b.hasAttribute('data-local-doc-new')){docOpen(b.dataset.localDocNew);return;}
 if(b.hasAttribute('data-local-doc-open')){const d=localDocumentRead().find(x=>x.id===b.dataset.localDocOpen);if(d)docOpen(d.type,d.id);return;}
 if(b.hasAttribute('data-local-doc-delete')){if(confirm('Удалить черновик с этого устройства?')){localDocumentWrite(localDocumentRead().filter(x=>x.id!==b.dataset.localDocDelete));render();}return;}
 if(b.hasAttribute('data-local-doc-close')){docClose();return;}
 if(b.hasAttribute('data-doc-step')){docSwitchStep(Number(b.dataset.docStep));return;}
 if(b.hasAttribute('data-doc-prev')||b.hasAttribute('data-doc-next')){docSwitchStep(docStep+(b.hasAttribute('data-doc-prev')?-1:1));return;}
 if(b.hasAttribute('data-doc-example')){docExample();return;}
 if(b.hasAttribute('data-doc-add-item')||b.hasAttribute('data-doc-remove-item')||b.hasAttribute('data-doc-add-operation')||b.hasAttribute('data-doc-remove-operation')){
  const d=localDocumentData();if(b.hasAttribute('data-doc-add-item'))d.items.push({subject:'',quantity:'1',unit:'шт.',price:'',vat:'Без НДС'});
  if(b.hasAttribute('data-doc-remove-item')){if(d.items.length===1)return alert('В документе должна остаться хотя бы одна строка.');d.items.splice(Number(b.dataset.docRemoveItem),1);}
  if(b.hasAttribute('data-doc-add-operation'))d.operations.push({date:'',document:'',debit:'',credit:'',otherDebit:'',otherCredit:''});
  if(b.hasAttribute('data-doc-remove-operation'))d.operations.splice(Number(b.dataset.docRemoveOperation),1);
  docPending=d;docDirty=true;render();docMount();docFlush();return;
 }
 const d=localDocumentData();if(!d)return;
 if(b.hasAttribute('data-doc-json')){docDownload(JSON.stringify({version:1,document:d},null,2),docFileName(d,'json'));return;}
 if(b.hasAttribute('data-local-doc-download')){docDownload(localDocumentHTML(d),docFileName(d,'html'),'text/html;charset=utf-8');docFlush();return;}
 if(b.hasAttribute('data-local-doc-print')){
  const invalid=[...document.querySelectorAll('[data-item-field="quantity"],[data-item-field="price"]')].find(el=>!el.value.trim()||!/^\d+(?:[.,]\d+)?$/.test(el.value.replace(/\s/g,'')));
  if(invalid){alert('Проверьте количество и цену: укажите неотрицательное число.');docSwitchStep(1);invalid.focus();return;}
  const win=window.open('','_blank');if(!win){alert('Разрешите открытие окна для печати в браузере.');return;}
  win.document.write(localDocumentHTML(d));win.document.close();win.focus();setTimeout(()=>win.print(),250);docFlush();
 }
});
document.addEventListener('submit',e=>{if(e.target.id!=='local-document-form')return;e.preventDefault();docDirty=true;docFlush();docUpdatePreview();});
document.addEventListener('keydown',e=>{const modal=document.querySelector('.doc-modal');if(!modal)return;if(e.key==='Escape'){e.preventDefault();docClose();}if(e.key==='Tab'){const focusable=[...modal.querySelectorAll('button,input,select,textarea,a[href],iframe')].filter(el=>!el.disabled&&el.getClientRects().length);const first=focusable[0],last=focusable.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus();}}});
window.addEventListener('beforeunload',e=>{if(docDirty&&!docFlush()){e.preventDefault();e.returnValue='';}});
new MutationObserver(docMount).observe(document.getElementById('content')||document.body,{childList:true,subtree:true});
docMount();

// Flush before the existing application's navigation handlers replace the form.
document.addEventListener('click',e=>{if(docDirty&&e.target.closest('[data-page],[data-go-home],[data-go-back]')&&!docFlush()){e.preventDefault();e.stopImmediatePropagation();}},true);

render();
</script></body></html>
