ight:800;font-size:17px;padding:10px 18px}.sidebar-stats{display:flex;flex-direction:column;gap:13px;margin-top:28px}.sidebar-stat{width:100%;display:flex;flex-direction:column;align-items:flex-start;gap:9px;text-align:left;background:#fff;color:#102b4a;border:1px solid #b5d5e4;border-radius:12px;padding:17px 14px;cursor:pointer;box-shadow:0 3px 12px rgba(0,0,0,.12)}.sidebar-stat:hover,.sidebar-stat:focus-visible{border-color:#12b8d7;outline:2px solid #12b8d7;outline-offset:2px}.sidebar-stat-label{font-size:14px;font-weight:650}.sidebar-stat-value{font-size:clamp(16px,1.4vw,21px);font-weight:850;overflow-wrap:anywhere}@media(max-width:680px){.sidebar-stats{display:grid;grid-template-columns:1fr;gap:9px;margin-top:10px}.sidebar-stat{padding:12px 15px;gap:4px}.sidebar-stat-value{font-size:19px}.brand{margin-bottom:0}}</style></head><body><section id="landing" class="landing" aria-label="Стартовая страница TRANSERA"><div class="landing-grid"><div><div class="landing-brand">ТрансЭра.РФ</div><div class="landing-intro">Единая платформа для экспедиторов, перевозчиков и грузовладельцев</div><div class="landing-feature"><b>▦</b><span>Профессиональные калькуляторы</span></div><div class="landing-feature"><b>☁</b><span>Облачное хранение данных</span></div><div class="landing-feature"><b>▣</b><span>Работа на компьютере и телефоне</span></div></div><div class="landing-card"><div class="landing-tabs"><button type="button" class="active" data-landing-tab="login">Вход</button><button type="button" data-landing-tab="register">Регистрация</button></div><h2 id="landing-title">Вход в ТрансЭра.РФ</h2><p id="landing-subtitle">Вход в личный кабинет</p><div id="landing-fields"><label>Электронная почта<input type="email" placeholder="example@mail.ru" autocomplete="email" required></label><label>Пароль<input type="password" placeholder="Пароль" autocomplete="current-password" required></label></div><p class="landing-password-hint" style="font-size:12px;color:#a9bfd1;margin:9px 0 3px;line-hei <script>
const API_URL='https://functions.yandexcloud.net/d4emctueu2poauh119et';
let landingTab='login';
let currentUser=null;
let editingProfile=false;
function profileKey(){return 'transera-profile-'+(currentUser?.email||'').toLowerCase();}
function applyProfileOverrides(){if(!currentUser?.email)return;try{const saved=JSON.parse(localStorage.getItem(profileKey())||'null');if(saved&&typeof saved==='object'){currentUser={...currentUser,full_name:saved.full_name??currentUser.full_name,organization:saved.organization??currentUser.organization};}}catch{}}

function showLandingTab(tab){
  if(tab==='recover'){document.getElementById('landing-error').textContent='Восстановление пароля пока не подключено. Для помощи обратитесь к администратору.';return;}
  landingTab=tab;
  document.querySelectorAll('[data-landing-tab]').forEach(b=>b.classList.toggle('active',b.dataset.landingTab===tab));
  document.getElementById('landing-title').textContent=tab==='register'?'Регистрация':'Вход в ТрансЭра.РФ';
  document.getElementById('landing-subtitle').textContent=tab==='register'?'Создайте учётную запись':'Войдите по электронной почте';
  const field=(label,type,name,auto)=>'<label>'+label+'<input name="'+name+'" type="'+type+'" autocomplete="'+auto+'" required></label>';
  document.getElementById('landing-fields').innerHTML=(tab==='register'?field('Имя','text','full_name','name')+field('Организация','text','organization','organization'):'')+field('Электронная почта','email','email','email')+field('Пароль','password','password',tab==='register'?'new-password':'current-password')+(tab==='register'?field('Повтор пароля','password','confirm','new-password'):'');
  document.querySelector('[data-landing-preview]').textContent=tab==='register'?'Зарегистрироваться':'Войти';
  document.getElementById('landing-error').textContent='';
}
async function apiRequest(path,body,token){
 const res=await fetch(API_URL+'?route='+encodeURIComponent(path),{method:body?'POST':'GET',headers:{...(body?{'Content-Type':'application/json'}:{}),...(token?{'X-TRANSERA-Token':'Bearer '+token}:{})},...(body?{body:JSON.stringify(body)}:{})});
 const data=await res.json().catch(()=>({}));
 if(!res.ok)throw Error(data.error||'Ошибка сервера ('+res.status+')');
 return data;
}
async function submitLanding(){
 const error=document.getElementById('landing-error'),btn=document.querySelector('[data-landing-preview]');
 const fields=document.getElementById('landing-fields');
 const get=name=>fields.querySelector('[name="'+name+'"]')?.value||'';
 const email=get('email').trim(),password=get('password');
 error.textContent='';
 if(!email||!email.includes('@')||password.length<10){error.textContent='Укажите почту и пароль не короче 10 символов.';return;}
 if(landingTab==='register'&&password!==get('confirm')){error.textContent='Пароли не совпадают.';return;}
 btn.disabled=true;
 try{
  const payload={email,password};
  if(landingTab==='register'){payload.full_name=get('full_name').trim();payload.organization=get('organization').trim();}
  const result=await apiRequest(landingTab==='register'?'/register':'/login',payload);
  if(!result.token)throw Error('Сервер не вернул токен');
  localStorage.removeItem('transera-auth-token');
  sessionStorage.setItem('transera-auth-token',result.token);
  currentUser=result.user||null;
  applyProfileOverrides();
  document.getElementById('landing').hidden=true;
  page='home';initNavigation();render();void syncDownload();
 }catch(e){error.textContent=e instanceof TypeError?'Нет соединения с сервером. Проверьте доступность функции и настройки CORS.':e.message;}
 finally{btn.disabled=false;}
}
document.addEventListener('click',e=>{
 const tab=e.target.closest('[data-landing-tab]');
 if(tab){showLandingTab(tab.dataset.landingTab);return;}
 if(e.target.closest('[data-landing-preview]')){submitLanding();return;}
 if(e.target.closest('[data-landing-logout]')){localStorage.removeItem('transera-auth-token');sessionStorage.removeItem('transera-auth-token');currentUser=null;document.getElementById('landing').hidden=false;showLandingTab('login');return;}
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.closest('#landing-fields')){e.preventDefault();submitLanding();}});
showLandingTab('login');
// Require a fresh login whenever the page is opened or reloaded.
localStorage.removeItem('transera-auth-token');
sessionStorage.removeItem('transera-auth-token');
const money=n=>new Intl.NumberFormat('ru-RU',{maximumFractionDigits:2}).format(Number(n)||0)+' ₽';
const num=v=>Math.max(0,Number(v)||0);
const defaults=()=>({mode:'hired',from:'',to:'',distance:0,emptyKm:0,rate:0,markup:0,extraCharge:0,manualPrice:'',carrierRate:0,carrierFixed:0,carrierPricing:'fixed',fuelConsumption:30,fuelPrice:65,driverPay:0,perDiem:0,tolls:0,parking:0,depreciation:1,maintenance:0,other:0,forwarderCosts:0,client:'',carrier:'',driver:'',cargo:'',weight:0,vehicle:'',loadDate:'',unloadDate:'',contactClient:'',contactCarrier:'',contactDriver:'',notes:'',status:'Новый',docsReceived:false,clientPayments:[],carrierPayments:[],clientDueDate:'',carrierDueDate:'',closedAt:'',actualCost:''});
let page='home',calcTab='price',draft=defaults(),editing=null,trips=[],calculations=[],db,selectedCalcId=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random();
function calc(d){const distance=num(d.distance),km=distance;const own=(km*num(d.fuelConsumption)/100*num(d.fuelPrice))+(km*num(d.driverPay))+num(d.tolls)+(km*num(d.depreciation));const hired=num(d.carrierFixed)+(distance*num(d.carrierRate))+num(d.forwarderCosts);const cost=d.mode==='own'?own:hired;const base=distance*num(d.rate);const price=d.mode==='own'?base:base*(1+num(d.markup)/100);const profit=price-cost;return {cost,price,profit,margin:price?profit/price*100:0,roi:cost?profit/cost*100:0,fuel:km*num(d.fuelConsumption)/100,base};}
function openDB(){return new Promise((resolve,reject)=>{const req=indexedDB.open('transera-v2',1);req.onupgradeneeded=()=>{const x=req.result;['trips','calculations'].forEach(t=>{if(!x.objectStoreNames.contains(t))x.createObjectStore(t,{keyPath:'id'});});};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);});}
function store(name,mode='readonly'){return db.transaction(name,mode).objectStore(name);}
function all(name){return new Promise((res,rej)=>{const r=store(name).getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
// New records only: old browser records are never automatically uploaded.
const syncAccount=()=>currentUser?.email?.trim().toLowerCase()||'';
const syncToken=()=>sessionStorage.getItem('transera-auth-token');
const syncKey=(kind)=>'transera-cloud-v1:'+kind+':'+syncAccount();
function syncRead(kind){try{const v=JSON.parse(localStorage.getItem(syncKey(kind))||'[]');return Array.isArray(v)?v:[];}catch{return [];}}
function syncWrite(kind,v){localStorage.setItem(syncKey(kind),JSON.stringify(v));}
function synced(name,id){return syncRead('ids').includes(name+':'+id);}
function markSynced(name,id){const a=syncRead('ids'),key=name+':'+id;if(!a.includes(key)){a.push(key);syncWrite('ids',a);}}
function localPut(name,item){return new Promise((res,rej)=>{const r=store(name,'readwrite').put(item);r.onsuccess=()=>res();r.onerror=()=>rej(r.error);});}
function localDel(name,id){return new Promise((res,rej)=>{const r=store(name,'readwrite').delete(id);r.onsuccess=()=>res();r.onerror=()=>rej(r.error);});}
function localGet(name,id){return new Promise((res,rej)=>{const r=store(name).get(id);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
let syncRunning=false;
let syncError='';
function showSyncStatus(){
 let panel=document.getElementById('transera-sync-status');
 if(!panel){
  panel=document.createElement('div');panel.id='transera-sync-status';
  panel.style.cssText='position:fixed;bottom:12px;right:12px;z-index:9999;max-width:min(370px,calc(100vw - 24px));background:#14253d;color:#fff;border:1px solid #3b7190;border-radius:10px;padding:10px 12px;font:13px/1.5 system-ui,sans-serif;box-shadow:0 3px 16px #0005';
  document.body.appendChild(panel);
 }
 if(!syncAccount()||!syncToken()){panel.hidden=true;return;}
 const pending=syncRead('queue').length;
 // Keep the overlay completely out of the way when synchronization is healthy.
 if(!syncError && pending===0){panel.hidden=true;return;}
 panel.hidden=false;
 panel.textContent=syncError?'Синхронизация: '+syncError:'Ожидают отправки: '+pending;
 const btn=document.createElement('button');btn.type='button';btn.textContent='Проверить снова';btn.style.cssText='display:block;margin-top:6px;padding:5px 9px;cursor:pointer';
 btn.onclick=async()=>{syncError='';panel.textContent='Проверяю соединение…';await syncDownload();showSyncStatus();};
 panel.appendChild(btn);
}

function syncEnqueue(name,id,action,item){
 if(!syncAccount()||!syncToken())return;
 const queue=syncRead('queue').filter(x=>!(x.name===name&&x.id===id));
 queue.push({name,id,action,item,nonce:uid()});
 syncWrite('queue',queue);void syncNow();
}
async function put(name,item){
 const previous=await localGet(name,item.id);
 await localPut(name,item);
 // Existing records from before cloud synchronization remain local-only.
 if(syncAccount()&&(!previous||synced(name,item.id))){
  markSynced(name,item.id);syncEnqueue(name,item.id,'save',item);
 }
}
async function del(name,id){
 const cloud=synced(name,id);
 await localDel(name,id);
 if(cloud)syncEnqueue(name,id,'delete',null);
}
async function syncNow(){
 if(syncRunning||!db||!syncAccount()||!syncToken()||!navigator.onLine)return;
 syncRunning=true;const account=syncAccount(),token=syncToken();
 try{
  for(const entry of syncRead('queue')){
   if(account!==syncAccount()||token!==syncToken())break;
   await apiRequest('/'+entry.name+'/'+entry.action,entry.action==='save'?{id:entry.id,data:entry.item}:{id:entry.id},token);
   if(account!==syncAccount())break;
   syncWrite('queue',syncRead('queue').filter(x=>x.nonce!==entry.nonce));
  }
 }catch(e){syncError='Отправка: '+(e?.message||String(e));showSyncStatus();console.warn('Cloud synchronization postponed; browser data retained',e);}
 finally{syncRunning=false;showSyncStatus();}
}
async function syncDownload(){
 if(!db||!syncAccount()||!syncToken()||!navigator.onLine)return;
 const account=syncAccount(),token=syncToken();
 await syncNow();
 for(const name of ['trips','calculations']){
  let response;
  try{response=await apiRequest('/'+name+'/list',null,token);}
  catch(e){syncError='Загрузка: '+(e?.message||String(e));showSyncStatus();console.warn('Cloud list unavailable',e);return;}
  if(account!==syncAccount()||token!==syncToken())return;
  const items=Array.isArray(response)?response:response?.items??response?.[name]??response?.records??response?.data;
  if(!Array.isArray(items)){syncError='Сервер вернул неожиданный формат списка '+name;showSyncStatus();console.warn('Unexpected cloud list response',name,response);return;}
  const pending=new Set(syncRead('queue').filter(x=>x.name===name).map(x=>x.id));
  for(const item of items){
   if(!item||typeof item.id!=='string'||pending.has(item.id))continue;
   const previous=await localGet(name,item.id);
   // Do not replace old local data or newer unsent local changes.
   if(!previous){await localPut(name,item);markSynced(name,item.id);}
  }
 }
 await refresh();showSyncStatus();
}
window.addEventListener('online',()=>{void syncDownload();});
async function refresh(){trips=await all('trips');calculations=await all('calculations');render();}

function results(showActions=true){const r=calc(draft);const actual=draft.actualCost===''?null:num(draft.actualCost);return '<div id="live-results" class="card"><h2>Результаты расчёта</h2>'+[['Стоимость заказчику',money(r.price)],['Плановая прибыль',money(r.profit)],['Маржинальность',r.margin.toFixed(1)+'%'],[draft.mode==='own'?'Себестоимость (топливо + амортизация и прочие расходы)':'Себестоимость (оплата перевозчика + другие затраты)',money(r.cost)]].map(([k,v],i)=>'<div class="line"><span>'+k+'</span><strong class="'+(i===1?(r.profit<0?'loss':'profit'):'')+'">'+v+'</strong></div>').join('')+(actual!==null?'<div class="line"><span>Фактическая себестоимость</span><strong>'+money(actual)+'</strong></div><div class="line"><span>Фактическая прибыль</span><strong>'+money(r.price-actual)+'</strong></div>':'')+(draft.mode==='own'?'<div class="line"><span>Топливо, л</span><strong>'+r.fuel.toFixed(1)+'</strong></div><div class="line"><span>Топливо, ₽</span><strong>'+money(r.fuel*num(draft.fuelPrice))+'</strong></div><div class="line"><span>Амортизация, ₽</span><strong>'+money(num(draft.distance)*num(draft.depreciation))+'</strong></div>':'')+''+(showActions?'<div class="actions"><button class="btn" data-action="save-calc">Сохранить расчёт</button><button class="btn secondary" data-action="new-trip">Создать рейс из расчёта</button></div>':'')+'</div>';}

const statuses=['Новый','Запланирован','В пути','На выгрузке','Доставлен','Закрыт','Отменён'];
const normalizeStatus=t=>t.status==='Выполнен'?'Доставлен':t.status;
const payments=(t,side)=>Array.isArray(t[side+'Payments'])?t[side+'Payments']:[];
const paid=(t,side)=>payments(t,side).reduce((sum,p)=>sum+num(p.amount),0);
const expected=(t,side)=>side==='client'?calc(t).price:(t.mode==='own'?0:num(t.carrierFixed)+num(t.distance)*num(t.carrierRate));
const due=(t,side)=>Math.max(0,expected(t,side)-paid(t,side));
const payLabel=(t,side)=>expected(t,side)===0?'Нет долга':due(t,side)<0.01?'Оплачено':paid(t,side)>0?'Частично':'Не оплачено';
const canClose=t=>!!t.docsReceived&&due(t,'client')<0.01&&due(t,'carrier')<0.01;

const localISODate=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
let financePeriod='month',financeDate=localISODate(new Date());
function financeRange(){
 if(financePeriod==='all')return ['0000-01-01','9999-12-31'];
 const d=new Date(financeDate+'T12:00:00');if(Number.isNaN(d.getTime()))return ['',''];
 const fmt=localISODate;
 let start=new Date(d),end=new Date(d);
 if(financePeriod==='week'){start.setDate(d.getDate()-(d.getDay()+6)%7);end=new Date(start);end.setDate(start.getDate()+6);}
 else if(financePeriod==='month'){start.setDate(1);end=new Date(d.getFullYear(),d.getMonth()+1,0);}
 
 return [fmt(start),fmt(end)];
}
function shiftFinancePeriod(direction){const d=new Date(financeDate+'T12:00:00');if(Number.isNaN(d.getTime()))return;const day=d.getDate();if(financePeriod==='all')return;if(financePeriod==='month'){d.setDate(1);d.setMonth(d.getMonth()+direction);d.setDate(Math.min(day,new Date(d.getFullYear(),d.getMonth()+1,0).getDate()));}else{d.setDate(d.getDate()+direction*(financePeriod==='week'?7:1));}financeDate=localISODate(d);render();}
function financePeriodControls(){

// Isolated subscription connectivity test: no payments or access restrictions.
const TRANSERA_PAYMENTS_URL='https://functions.yandexcloud.net/d4ep5vln1lk0qornbcpr';
document.addEventListener('click',async e=>{
 const btn=e.target.closest('[data-check-subscription]');
 if(!btn)return;
 const status=document.getElementById('transera-subscription-status');
 if(!status)return;
 const token=sessionStorage.getItem('transera-auth-token');
 if(!token){status.textContent='Сначала войдите в аккаунт.';return;}
 btn.disabled=true;status.textContent='Проверяем подключение…';
 try{
  const response=await fetch(TRANSERA_PAYMENTS_URL+'?route=%2Fsubscription',{
   method:'GET',headers:{'X-TRANSERA-Token':'Bearer '+token},signal:AbortSignal.timeout(15000)
  });
  const data=await response.json().catch(()=>({}));
  if(!response.ok)throw Error(data.error||'HTTP '+response.status);
  const sub=data.subscription;
  if(!sub||typeof sub.active!=='boolean')throw Error('Неожиданный ответ сервера');
  const fmt=value=>value?new Date(value).toLocaleDateString('ru-RU'):'—';
  status.textContent='Соединение установлено. Статус: '+(sub.active?'активна':'истекла')+'. Пробный период до '+fmt(sub.trial_ends_at)+'. Оплачено до '+fmt(sub.paid_until)+'.';
 }catch(err){status.textContent='Не удалось проверить подписку: '+(err?.message||String(err));}
 finally{btn.disabled=false;}
});

// Test-only T-Bank payment and promo code integration.
async function subscriptionApi(route,body){
 const token=sessionStorage.getItem('transera-auth-token');
 if(!token)throw Error('Сначала войдите в аккаунт.');
 const response=await fetch(TRANSERA_PAYMENTS_URL+'?route='+encodeURIComponent(route),{
  method:body?'POST':'GET',
  headers:{'X-TRANSERA-Token':'Bearer '+token,...(body?{'Content-Type':'application/json'}:{})},
  ...(body?{body:JSON.stringify(body)}:{}),
  signal:AbortSignal.timeout(20000)
 });
 const data=await response.json().catch(()=>({}));
 if(!response.ok)throw Error(data.error||'HTTP '+response.status);
 return data;
}
document.addEventListener('click',async e=>{

 if(!confirm('Открыть тестовую оплату Т-Банка? Реальные деньги не списываются.'))return;
 button.disabled=true;panel.textContent='Создаём тестовый платёж…';

  if(!['securepay.tinkoff.ru','securepay.tbank.ru','pay.tbank-online.com'].includes(url.hostname))throw Error('Неожиданный домен платёжной страницы: '+url.hostname+'. Оплата не открыта.');

 }catch(err){panel.textContent='Не удалось создать тестовый платёж: '+(err?.message||String(err));}

});

 finally{button.disabled=false;}
});
