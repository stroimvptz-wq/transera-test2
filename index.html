<script>
const API_URL='https://functions.yandexcloud.net/d4emctueu2poauh119et';
let landingTab='login';
let currentUser=null;
let editingProfile=false;
function profileKey(){return 'transera-profile-'+(currentUser?.email||'').toLowerCase();}
function applyProfileOverrides(){if(!currentUser?.email)return;try{const saved=JSON.parse(localStorage.getItem(profileKey())||'null');if(saved&&typeof saved==='object'){currentUser={...currentUser,full_name:saved.full_name??currentUser.full_name,organization:saved.organization??currentUser.organization};}}catch{}}

function showLandingTab(tab){
  if(tab==='recover'){document.getElementById('landing-error').textContent='Восстановление пароля пока не подключено. Для помощи обратитесь к администратору.';return;}
  landingTab=tab;
  document.querySelectorAll('[data-landing-tab]').forEach(b=>b.classList.toggle('active',b.dataset.landingTab===tab));

function syncEnqueue(name,id,action,item){

async function syncNow(){

 await syncNow();

  let response;
  try{response=await apiRequest('/'+name+'/list',null,token);}
  catch(e){syncError='Загрузка: '+(e?.message||String(e));showSyncStatus();console.warn('Cloud list unavailable',e);return;}
  if(account!==syncAccount()||token!==syncToken())return;
  const items=Array.isArray(response)?response:response?.items??response?.[name]??response?.records??response?.data;
  if(!Array.isArray(items)){syncError='Сервер вернул неожиданный формат списка '+name;showSyncStatus();console.warn('Unexpected cloud list response',name,response);return;}
  const pending=new Set(syncRead('queue').filter(x=>x.name===name).map(x=>x.id));

   if(!item||typeof item.id!=='string'||pending.has(item.id))continue;

   if(!previous){await localPut(name,item);markSynced(name,item.id);}

const localISODate=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');

function financeRange(){
 if(financePeriod==='all')return ['0000-01-01','9999-12-31'];
 const d=new Date(financeDate+'T12:00:00');if(Number.isNaN(d.getTime()))return ['',''];
 const fmt=localISODate;
 let start=new Date(d),end=new Date(d);
 if(financePeriod==='week'){start.setDate(d.getDate()-(d.getDay()+6)%7);end=new Date(start);end.setDate(start.getDate()+6);}
 else if(financePeriod==='month'){start.setDate(1);end=new Date(d.getFullYear(),d.getMonth()+1,0);}
 
 return [fmt(start),fmt(end)];
}
function shiftFinancePeriod(direction){const d=new Date(financeDate+'T12:00:00');if(Number.isNaN(d.getTime()))return;const day=d.getDate();if(financePeriod==='all')return;if(financePeriod==='month'){d.setDate(1);d.setMonth(d.getMonth()+direction);d.setDate(Math.min(day,new Date(d.getFullYear(),d.getMonth()+1,0).getDate()));}else{d.setDate(d.getDate()+direction*(financePeriod==='week'?7:1));}financeDate=localISODate(d);render();}

 const data=Object.fromEntries(new FormData(e.target).entries());if(!data.name?.trim()){alert('Укажите название или ФИО');return;}
 const db=localDirectoryRead();data.id=data.id||uid();const idx=db.records.findIndex(x=>x.id===data.id);if(idx>=0)db.records[idx]=data;else db.records.push(data);
 if(!db.defaultId&&db.records.length===1)db.defaultId=data.id;
 try{localDirectoryWrite(db);render();alert('Реквизиты сохранены на этом устройстве.');}catch(err){alert('Не удалось сохранить: '+err.message);}
});
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-dir-edit],[data-dir-default],[data-dir-delete],[data-dir-export],[data-dir-reset],[data-dir-toggle]');
 if(!b)return;
 if(b.hasAttribute('data-dir-toggle')){localDirectoryOpen=!localDirectoryOpen;render();return;}
 if(b.hasAttribute('data-dir-export')){localDirectoryDownload();return;}
 if(b.hasAttribute('data-dir-reset')){localDirectoryReset();return;}
 const db=localDirectoryRead(),id=b.dataset.dirEdit||b.dataset.dirDefault||b.dataset.dirDelete,party=db.records.find(x=>x.id===id);
 if(b.hasAttribute('data-dir-default')){db.defaultId=id;localDirectoryWrite(db);render();return;}
 if(b.hasAttribute('data-dir-delete')){if(!confirm('Удалить реквизиты из справочника?'))return;db.records=db.records.filter(x=>x.id!==id);if(db.defaultId===id)db.defaultId=null;localDirectoryWrite(db);render();return;}
 if(b.hasAttribute('data-dir-edit')&&party){localDirectoryOpen=true;render();const f=document.getElementById('local-directory-form');for(const [k,v] of Object.entries(party)){const el=f.elements.namedItem(k);if(el)el.value=v||'';}document.getElementById('local-directory-heading').textContent='Редактировать реквизиты';f.scrollIntoView({behavior:'smooth',block:'start'});}
});

// Subscription access control (test2). Fail closed on network errors.
let transeraAccess={state:'checking',subscription:null};
async function transeraRefreshAccess(){
 const token=sessionStorage.getItem('transera-auth-token');
 if(!token){transeraAccess={state:'checking',subscription:null};return;}
 try{
  const res=await fetch('https://functions.yandexcloud.net/d4ep5vln1lk0qornbcpr?route=%2Fsubscription',{headers:{'X-TRANSERA-Token':'Bearer '+token},signal:AbortSignal.timeout(15000),cache:'no-store'});
  if(!res.ok)throw Error('HTTP '+res.status);
  const data=await res.json();
  if(typeof data.subscription?.active!=='boolean')throw Error('Invalid subscription');
  transeraAccess={state:data.subscription.active?'active':'expired',subscription:data.subscription};
 }catch(error){transeraAccess={state:'unavailable',subscription:null};}
 if(transeraAccess.state!=='active'&&page!=='account'&&page!=='home'){page='account';tripEditor=false;editing=null;}
 render();
}

 return '<div class="card section" style="max-width:640px;margin:20px auto;text-align:center"><h2>'+(transeraAccess.state==='checking'?'⏳ ':'🔒 ')+title+'</h2><p class="muted">'+msg+'</p>'+(transeraAccess.state==='checking'?'':'<div class="actions" style="justify-content:center"><button type="button" class="btn" data-page="account">Продлить подписку</button><button type="button" class="btn secondary" data-refresh-access>Проверить снова</button></div>')+'</div>';
}

document.addEventListener('keydown',e=>{
 const el=e.target;
 if(!el.matches || !el.matches('input[data-numeric]') || e.ctrlKey || e.metaKey || e.altKey || e.isComposing)return;
 const k=e.key;
 if(!/^\\d$/.test(k) && k!=='.' && k!==',' && k!=='Backspace')return;
 e.preventDefault();
 let v=el.value;
 if(k==='Backspace')v=v.slice(0,-1);
 else if(k==='.'||k===','){if(!v.includes('.'))v=(v||'0')+'.';}
 else v=(v==='0'?k:v+k);
 el.value=v;
 el.dispatchEvent(new Event('input',{bubbles:true}));
 el.setSelectionRange(el.value.length,el.value.length);
});

async function subscriptionApi(route,body){
 const token=sessionStorage.getItem('transera-auth-token');
 if(!token)throw Error('Сначала войдите в аккаунт.');
 const response=await fetch(TRANSERA_PAYMENTS_URL+'?route='+encodeURIComponent(route),{
  method:body?'POST':'GET',
  headers:{'X-TRANSERA-Token':'Bearer '+token,...(body?{'Content-Type':'application/json'}:{})},
  ...(body?{body:JSON.stringify(body)}:{}),
  signal:AbortSignal.timeout(20000)
 });
 const data=await response.json().catch(()=>({}));
 if(!response.ok)throw Error(data.error||'HTTP '+response.status);
 return data;
}
document.addEventListener('click',e=>{const card=e.target.closest('.subscription-tariff');if(card&&!e.target.closest('button'))card.querySelector('[data-test-pay]')?.click();});

document.addEventListener('click',async e=>{
 const button=e.target.closest('[data-test-pay]');
 if(!button)return;
 const panel=document.getElementById('transera-payment-status');
 if(!panel)return;
 if(!confirm('Открыть страницу Т-Банка для настоящей оплаты? Само открытие страницы не списывает деньги. Не подтверждайте оплату, если пока только проверяете ссылку.'))return;
 button.disabled=true;panel.textContent='Создаём платёжную ссылку…';
 try{
  const result=await subscriptionApi('/payments/create',{plan:button.dataset.testPay});
  if(result.test_mode!==false||!/^https:\/\//.test(result.payment_url||''))throw Error('Сервер не подтвердил рабочий режим оплаты');
  const url=new URL(result.payment_url);
  if(!['securepay.tinkoff.ru','securepay.tbank.ru','pay.tbank-online.com'].includes(url.hostname))throw Error('Неожиданный домен платёжной страницы: '+url.hostname+'. Оплата не открыта.');
  panel.textContent='Платёжная страница открыта. Пока не подтверждайте оплату, если проверяете только ссылку. После реальной оплаты вернитесь и проверьте подписку.';
  window.open(url.href,'_blank','noopener,noreferrer');
 }catch(err){panel.textContent='Не удалось создать платёж: '+(err?.message||String(err));}
 finally{button.disabled=false;}
});
document.addEventListener('submit',async e=>{
 if(e.target?.id!=='transera-promo-form')return;
 e.preventDefault();
 const form=e.target,button=form.querySelector('button'),panel=document.getElementById('transera-promo-status');
 if(!panel)return;
 button.disabled=true;panel.textContent='Проверяем промокод…';
 try{
  const result=await subscriptionApi('/promo/redeem',{code:form.elements.promo.value.trim()});
  if(!result.activated)throw Error('Промокод не активирован');void transeraRefreshAccess();
  panel.textContent='Промокод активирован! Подписка продлена до '+new Date(result.paid_until).toLocaleDateString('ru-RU')+'.';
  form.reset();
 }catch(err){panel.textContent='Промокод: '+(err?.message||String(err));}
 finally{button.disabled=false;}
});
