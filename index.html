<script>
const API_URL=window.BUSINESS_PLATFORM.auth;
let landingTab='login';
let currentUser=null;
let editingProfile=false;
function profileKey(){return 'transera-profile-'+(currentUser?.email||'').toLowerCase();}
function applyProfileOverrides(){if(!currentUser?.email)return;try{const saved=JSON.parse(localStorage.getItem(profileKey())||'null');if(saved&&typeof saved==='object'){currentUser={...currentUser,full_name:saved.full_name??currentUser.full_name,organization:saved.organization??currentUser.organization};}}catch{}}

function showLandingTab(tab){
  if(tab==='recover'){document.getElementById('landing-error').textContent='Восстановление пароля пока не подключено. Для помощи обратитесь к администратору.';return;}
  landingTab=tab;
  document.querySelectorAll('[data-landing-tab]').forEach(b=>b.classList.toggle('active',b.dataset.landingTab===tab));
  document.getElementById('landing-title').textContent=tab==='register'?'Регистрация':'Вход в Business AI';
  document.getElementById('landing-subtitle').textContent=tab==='register'?'Создайте учётную запись':'Войдите по электронной почте';
  const field=(label,type,name,auto)=>'<label>'+label+'<span class="landing-password-wrap"><input name="'+name+'" type="'+type+'" autocomplete="'+auto+'" required>'+(type==='password'?'<button type="button" class="landing-password-eye" data-password-eye aria-label="Показать пароль" aria-pressed="false" title="Показать пароль">👁</button>':'')+'</span></label>';
  document.getElementById('landing-fields').innerHTML=(tab==='register'?field('Имя','text','full_name','name')+field('Организация','text','organization','organization'):'')+field('Электронная почта','email','email','email')+field('Пароль','password','password',tab==='register'?'new-password':'current-password')+(tab==='register'?field('Повтор пароля','password','confirm','new-password'):'');
  document.querySelector('[data-landing-preview]').textContent=tab==='register'?'Зарегистрироваться':'Войти';
  document.getElementById('landing-error').textContent='';
}
async function apiRequest(path,body,token){
 const res=await fetch(API_URL+'?route='+encodeURIComponent(path),{method:body?'POST':'GET',headers:{...(body?{'Content-Type':'application/json'}:{}),...(token?{'X-TRANSERA-Token':'Bearer '+token}:{})},...(body?{body:JSON.stringify(body)}:{})});
 const data=await res.json().catch(()=>({}));
 if(!res.ok){const error=Error(data.error||'Ошибка сервера ('+res.status+')');error.status=res.status;throw error;}
 return data;
}
async function submitLanding(){
 const error=document.getElementById('landing-error'),btn=document.querySelector('[data-landing-preview]');
 const fields=document.getElementById('landing-fields');
 const get=name=>fields.querySelector('[name="'+name+'"]')?.value||'';
 const email=get('email').trim(),password=get('password');
 error.textContent='';
 if(!email||!email.includes('@')||password.length<10){error.textContent='Укажите почту и пароль не короче 10 символов.';return;}
 if(landingTab==='register'&&password!==get('confirm')){error.textContent='Пароли не совпадают.';return;}
 btn.disabled=true;
 try{
  const payload={email,password};
  if(landingTab==='register'){payload.full_name=get('full_name').trim();payload.organization=get('organization').trim();}
  const result=await apiRequest(landingTab==='register'?'/register':'/login',payload);
  if(!result.token)throw Error('Сервер не вернул токен');
  localStorage.removeItem('business-ai-test2-auth-token');
  sessionStorage.setItem('business-ai-test2-auth-token',result.token);
  currentUser=result.user||null;
  await switchAccountDatabase();
  applyProfileOverrides();
  document.getElementById('landing').hidden=true;
  page='home';transeraAccess={state:'checking',subscription:null};initNavigation();render();void transeraRefreshAccess();void syncDownload();
 }catch(e){error.textContent=e instanceof TypeError?'Нет соединения с сервером. Проверьте доступность функции и настройки CORS.':e.message;}
 finally{btn.disabled=false;}
}
document.addEventListener('click',e=>{
 const eye=e.target.closest('[data-password-eye]');
 if(eye){const input=eye.parentElement.querySelector('input');if(input){const visible=input.type==='password';input.type=visible?'text':'password';eye.setAttribute('aria-pressed',String(visible));eye.setAttribute('aria-label',visible?'Скрыть пароль':'Показать пароль');eye.title=visible?'Скрыть пароль':'Показать пароль';}return;}
 const tab=e.target.closest('[data-landing-tab]');
 if(tab){showLandingTab(tab.dataset.landingTab);return;}
 if(e.target.closest('[data-landing-preview]')){submitLanding();return;}
 if(e.target.closest('[data-landing-logout]')){localStorage.removeItem('business-ai-test2-auth-token');sessionStorage.removeItem('business-ai-test2-auth-token');currentUser=null;document.getElementById('landing').hidden=false;showLandingTab('login');return;}
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.closest('#landing-fields')){e.preventDefault();submitLanding();}});
showLandingTab('login');
// Keep the current tab session across internal pages; /me validates it on startup.
localStorage.removeItem('business-ai-test2-auth-token');
const money=n=>new Intl.NumberFormat('ru-RU',{maximumFractionDigits:2}).format(Number(n)||0)+' ₽';
const num=v=>Math.max(0,Number(v)||0);
const defaults=()=>({mode:'hired',from:'',to:'',distance:0,emptyKm:0,rate:0,markup:0,extraCharge:0,manualPrice:'',carrierRate:0,carrierFixed:0,carrierPricing:'fixed',fuelConsumption:30,fuelPrice:65,driverPay:0,perDiem:0,tolls:0,parking:0,depreciation:1,maintenance:0,other:0,forwarderCosts:0,client:'',carrier:'',driver:'',cargo:'',weight:0,vehicle:'',loadDate:'',unloadDate:'',contactClient:'',contactCarrier:'',contactDriver:'',notes:'',status:'Новый',docsReceived:false,clientPayments:[],carrierPayments:[],clientDueDate:'',carrierDueDate:'',closedAt:'',actualCost:''});
let page=location.hash==='#account'?'account':'home',calcTab='price',draft=defaults(),editing=null,trips=[],calculations=[],db,selectedCalcId=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random();
function calc(d){const distance=num(d.distance),km=distance;const own=(km*num(d.fuelConsumption)/100*num(d.fuelPrice))+(km*num(d.driverPay))+num(d.tolls)+(km*num(d.depreciation));const hired=num(d.carrierFixed)+(distance*num(d.carrierRate))+num(d.forwarderCosts);const cost=d.mode==='own'?own:hired;const base=distance*num(d.rate);const price=d.mode==='own'?base:base*(1+num(d.markup)/100);const profit=price-cost;return {cost,price,profit,margin:price?profit/price*100:0,roi:cost?profit/cost*100:0,fuel:km*num(d.fuelConsumption)/100,base};}
let accountDatabaseEpoch=0;
function openDB(){return new Promise((resolve,reject)=>{const req=indexedDB.open('business-ai-test2:'+encodeURIComponent(String(currentUser?.email||'guest').toLowerCase()),1);req.onupgradeneeded=()=>{const x=req.result;['trips','calculations'].forEach(t=>{if(!x.objectStoreNames.contains(t))x.createObjectStore(t,{keyPath:'id'});});};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);});}
async function switchAccountDatabase(){const epoch=++accountDatabaseEpoch;if(db)db.close();const opened=await openDB();if(epoch!==accountDatabaseEpoch){opened.close();return;}db=opened;const owner=syncAccount(),rows=await all('trips'),calcs=await all('calculations');if(epoch!==accountDatabaseEpoch||owner!==syncAccount())return;trips=rows;calculations=calcs;}
function store(name,mode='readonly'){return db.transaction(name,mode).objectStore(name);}
function all(name){return new Promise((res,rej)=>{const r=store(name).getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
// New records only: old browser records are never automatically uploaded.
const syncAccount=()=>currentUser?.email?.trim().toLowerCase()||'';
const syncToken=()=>sessionStorage.getItem('business-ai-test2-auth-token');
const syncKey=(kind)=>'transera-cloud-v1:'+kind+':'+syncAccount();
function syncRead(kind){try{const v=JSON.parse(localStorage.getItem(syncKey(kind))||'[]');return Array.isArray(v)?v:[];}catch{return [];}}
function syncWrite(kind,v){localStorage.setItem(syncKey(kind),JSON.stringify(v));}
function synced(name,id){return syncRead('ids').includes(name+':'+id);}
function markSynced(name,id){const a=syncRead('ids'),key=name+':'+id;if(!a.includes(key)){a.push(key);syncWrite('ids',a);}}
function localPut(name,item){return new Promise((res,rej)=>{const r=store(name,'readwrite').put(item);r.onsuccess=()=>res();r.onerror=()=>rej(r.error);});}
function localDel(name,id){return new Promise((res,rej)=>{const r=store(name,'readwrite').delete(id);r.onsuccess=()=>res();r.onerror=()=>rej(r.error);});}
function localGet(name,id){return new Promise((res,rej)=>{const r=store(name).get(id);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
let syncRunning=false;
let syncError='';
function showSyncStatus(){
 let panel=document.getElementById('transera-sync-status');
 if(!panel){
  panel=document.createElement('div');panel.id='transera-sync-status';
  panel.style.cssText='position:fixed;bottom:12px;right:12px;z-index:9999;max-width:min(370px,calc(100vw - 24px));background:#14253d;color:#fff;border:1px solid #3b7190;border-radius:10px;padding:10px 12px;font:13px/1.5 system-ui,sans-serif;box-shadow:0 3px 16px #0005';
  document.body.appendChild(panel);
 }
 if(!syncAccount()||!syncToken()){panel.hidden=true;return;}
 const pending=syncRead('queue').length;
 // Keep the overlay completely out of the way when synchronization is healthy.
 if(!syncError && pending===0){panel.hidden=true;return;}
 panel.hidden=false;
 panel.textContent=syncError?'Синхронизация: '+syncError:'Ожидают отправки: '+pending;
 const btn=document.createElement('button');btn.type='button';btn.textContent='Проверить снова';btn.style.cssText='display:block;margin-top:6px;padding:5px 9px;cursor:pointer';
 btn.onclick=async()=>{syncError='';panel.textContent='Проверяю соединение…';await syncDownload();showSyncStatus();};
 panel.appendChild(btn);
}

function syncEnqueue(name,id,action,item){
 if(!syncAccount()||!syncToken())return;
 const queue=syncRead('queue').filter(x=>!(x.name===name&&x.id===id));
 queue.push({name,id,action,item,nonce:uid()});
 syncWrite('queue',queue);void syncNow();
}
async function put(name,item){
 const previous=await localGet(name,item.id);
 await localPut(name,item);
 // Existing records from before cloud synchronization remain local-only.
 if(syncAccount()&&(!previous||synced(name,item.id))){
  markSynced(name,item.id);syncEnqueue(name,item.id,'save',item);
 }
}
async function del(name,id){
 const cloud=synced(name,id);
 await localDel(name,id);
 if(cloud)syncEnqueue(name,id,'delete',null);
}
async function syncNow(){
 if(syncRunning||!db||!syncAccount()||!syncToken()||!navigator.onLine)return;
 syncRunning=true;const account=syncAccount(),token=syncToken();
 try{
  for(const entry of syncRead('queue')){
   if(account!==syncAccount()||token!==syncToken())break;
   await apiRequest('/'+entry.name+'/'+entry.action,entry.action==='save'?{id:entry.id,data:entry.item}:{id:entry.id},token);
   if(account!==syncAccount())break;
   syncWrite('queue',syncRead('queue').filter(x=>x.nonce!==entry.nonce));
  }
 }catch(e){syncError='Отправка: '+(e?.message||String(e));showSyncStatus();console.warn('Cloud synchronization postponed; browser data retained',e);}
 finally{syncRunning=false;showSyncStatus();}
}
async function syncDownload(){
 if(!db||!syncAccount()||!syncToken()||!navigator.onLine)return;
 const account=syncAccount(),token=syncToken();
 await syncNow();
 for(const name of ['trips','calculations']){
  let response;
  try{response=await apiRequest('/'+name+'/list',null,token);}
  catch(e){syncError='Загрузка: '+(e?.message||String(e));showSyncStatus();console.warn('Cloud list unavailable',e);return;}
  if(account!==syncAccount()||token!==syncToken())return;
  const items=Array.isArray(response)?response:response?.items??response?.[name]??response?.records??response?.data;
  if(!Array.isArray(items)){syncError='Сервер вернул неожиданный формат списка '+name;showSyncStatus();console.warn('Unexpected cloud list response',name,response);return;}
  const pending=new Set(syncRead('queue').filter(x=>x.name===name).map(x=>x.id));
  for(const item of items){
   if(!item||typeof item.id!=='string'||pending.has(item.id))continue;
   const previous=await localGet(name,item.id);
   // Do not replace old local data or newer unsent local changes.
   if(!previous){await localPut(name,item);markSynced(name,item.id);}
  }
 }
 await refresh();showSyncStatus();
}
window.addEventListener('online',()=>{void syncDownload();});

const routeCityNames=routeCityRecords.map(p=>p[0]);
const routeNorm=s=>String(s||'').split(',')[0].trim().toLocaleLowerCase('ru').replace(/ё/g,'е');
const routeKey=s=>String(s||'').trim().toLocaleLowerCase('ru').replace(/ё/g,'е');
function routeFindCity(value){
 const q=routeKey(value),name=routeNorm(value);
 if(!name)return null;
 return routeCityRecords.find(c=>routeKey(c[0]+', '+c[1])===q)||routeCityRecords.find(c=>routeNorm(c[0])===name)||null;
}
function routeDistance(from,to){
 const a=routeNorm(from),b=routeNorm(to);
 if(!a||!b)return null;
 if(a===b){const x=routeFindCity(from),y=routeFindCity(to);if(x&&y&&routeKey(x[1])===routeKey(y[1]))return {km:0,estimated:false};}
 const pair=routeCityPairs.find(p=>(routeNorm(p[0])===a&&routeNorm(p[1])===b)||(routeNorm(p[0])===b&&routeNorm(p[1])===a));
 if(pair)return {km:pair[2],estimated:false};
 const x=routeFindCity(from),y=routeFindCity(to);if(!x||!y)return null;
 const rad=Math.PI/180,dLat=(y[2]-x[2])*rad,dLon=(y[3]-x[3])*rad;
 const h=Math.sin(dLat/2)**2+Math.cos(x[2]*rad)*Math.cos(y[2]*rad)*Math.sin(dLon/2)**2;
 const air=6371*2*Math.asin(Math.min(1,Math.sqrt(h)));
 // Offline road-distance heuristic; NOT a routed road distance.
 const factor=air<80?1.5:air<300?1.4:air<800?1.32:1.27;
 return {km:Math.round(air*factor),estimated:true};
}
function routeSuggest(input){const key=input.dataset.field;if(key!=='from'&&key!=='to')return;const parent=input.closest('label');if(!parent)return;parent.style.position='relative';parent.querySelector('.route-suggestions')?.remove();const q=routeNorm(input.value);if(!q)return;const matches=routeCityRecords.filter(c=>routeNorm(c[0]).startsWith(q)&&routeNorm(c[0])!==q).slice(0,8);if(!matches.length)return;const list=document.createElement('div');list.className='route-suggestions';for(const city of matches){const item=document.createElement('button');item.type='button';item.className='route-suggestion';item.textContent=city[0]+' — '+city[1];item.addEventListener('mousedown',e=>e.preventDefault());item.addEventListener('click',()=>{input.value=city[0]+', '+city[1];input.dispatchEvent(new Event('input',{bubbles:true}));list.remove();input.focus();});list.appendChild(item);}parent.appendChild(list);}
function routeAutoFill(){
 const from=document.querySelector('[data-field="from"]'),to=document.querySelector('[data-field="to"]'),distance=document.querySelector('[data-field="distance"]');
 if(!from||!to||!distance)return;
 const result=routeDistance(from.value,to.value);
 let note=distance.closest('label')?.querySelector('.route-km-note');
 if(!note&&distance.closest('label')){note=document.createElement('small');note.className='route-km-note';note.style.cssText='display:block;font-size:11px;margin-top:4px;opacity:.75';distance.closest('label').appendChild(note);}
 if(!result){if(note)note.textContent='';return;}
 const km=String(result.km);
 if(note)note.textContent='';
 if(String(draft.distance)===km)return;
 draft.distance=km;distance.value=km;
 const live=document.getElementById('live-results');if(live)live.outerHTML=results(!tripEditor);
}

function editor(){const own=draft.mode==='own';return '<div class="card"><h2>Данные перевозки</h2><div class="fields">'+((page==='calculators'||(page==='trips'&&tripEditor))?'<div class="transport-mode-switch"><button type="button" class="transport-mode-btn '+(own?'active':'')+'" data-transport-mode="own" aria-pressed="'+own+'">Собственный транспорт</button><button type="button" class="transport-mode-btn '+(!own?'active':'')+'" data-transport-mode="hired" aria-pressed="'+(!own)+'">Наёмный транспорт</button></div>':field('mode','Тип транспорта','text',[['own','Собственный транспорт'],['hired','Наёмный перевозчик']])+'<div></div>')+field('from','Откуда','text')+field('distance','Расстояние, км')+field('to','Куда','text')+field('rate','Ставка, ₽/км')+(own?'':field('markup','Наценка, %'))+'</div><div class="section"><h2>'+(own?'Расходы собственного транспорта':'Расходы наёмного перевозчика')+'</h2><div class="fields">'+(own?field('fuelConsumption','Расход топлива, л/100 км')+field('fuelPrice','Цена топлива, ₽/л')+field('driverPay','Зарплата водителя, ₽/км')+field('tolls','Платные дороги, ₽')+field('depreciation','Амортизация, ₽/км'):field('carrierFixed','Стоимость перевозчика за рейс, ₽')+field('carrierRate','Стоимость перевозчика, ₽/км')+field('forwarderCosts','Дополнительные расходы экспедитора, ₽'))+'</div></div></div>';}
function results(showActions=true){const r=calc(draft);const actual=draft.actualCost===''?null:num(draft.actualCost);return '<div id="live-results" class="card"><h2>Результаты расчёта</h2>'+[['Стоимость заказчику',money(r.price)],['Плановая прибыль',money(r.profit)],['Маржинальность',r.margin.toFixed(1)+'%'],[draft.mode==='own'?'Себестоимость (топливо + амортизация и прочие расходы)':'Себестоимость (оплата перевозчика + другие затраты)',money(r.cost)]].map(([k,v],i)=>'<div class="line"><span>'+k+'</span><strong class="'+(i===1?(r.profit<0?'loss':'profit'):'')+'">'+v+'</strong></div>').join('')+(actual!==null?'<div class="line"><span>Фактическая себестоимость</span><strong>'+money(actual)+'</strong></div><div class="line"><span>Фактическая прибыль</span><strong>'+money(r.price-actual)+'</strong></div>':'')+(draft.mode==='own'?'<div class="line"><span>Топливо, л</span><strong>'+r.fuel.toFixed(1)+'</strong></div><div class="line"><span>Топливо, ₽</span><strong>'+money(r.fuel*num(draft.fuelPrice))+'</strong></div><div class="line"><span>Амортизация, ₽</span><strong>'+money(num(draft.distance)*num(draft.depreciation))+'</strong></div>':'')+''+(showActions?'<div class="actions"><button class="btn calc-action-highlight" data-action="save-calc">Сохранить расчёт</button><button class="btn secondary calc-action-highlight" data-action="new-trip">Создать рейс из расчёта</button></div>':'')+'</div>';}
function calculators(){const selected=calculations.find(c=>c.id===selectedCalcId);return '<div class="top"><div><h1>Калькуляторы</h1><p class="muted">Расчёт перевозки · собственный и наёмный транспорт</p></div></div><div class="tabs">'+[['price','Стоимость перевозки']].map(([id,label])=>'<button class="tab '+(calcTab===id?'active':'')+'" data-tab="'+id+'">'+label+'</button>').join('')+'</div><div class="two">'+editor()+results()+'</div>'+(selected?'<div class="card section saved-calc-actions"><h2>Открыт сохранённый расчёт</h2><p class="muted">'+esc(selected.from||'Откуда')+' — '+esc(selected.to||'Куда')+'</p><div class="actions"><button class="btn" data-action="trip-from-saved-calc" data-id="'+esc(selected.id)+'">Создать рейс из расчёта</button><button class="btn danger" data-action="delete-calc" data-id="'+esc(selected.id)+'">Удалить расчёт</button></div></div>':'')+'<div class="card section"><h2>Сохранённые расчёты</h2>'+(calculations.length?'<div class="saved-calcs">'+calculations.slice().reverse().map(c=>'<button type="button" class="saved-calc-card '+(c.id===selectedCalcId?'selected':'')+'" data-action="load-calc" data-id="'+esc(c.id)+'"><span class="saved-calc-route">'+esc(c.from||'Откуда')+' — '+esc(c.to||'Куда')+'</span><span class="saved-calc-type">'+(c.mode==='own'?'Свой транспорт':'Наёмный транспорт')+'</span><span class="saved-calc-values"><span>Стоимость: <strong>'+money(calc(c).price)+'</strong></span><span>Прибыль: <strong>'+money(calc(c).profit)+'</strong></span></span><span class="saved-calc-chevron">›</span></button>').join('')+'</div>':'<p class="muted">Пока нет сохранённых расчётов.</p>')+'</div>';}
const statuses=['Новый','Запланирован','В пути','На выгрузке','Доставлен','Закрыт','Отменён'];
const normalizeStatus=t=>t.status==='Выполнен'?'Доставлен':t.status;
const payments=(t,side)=>Array.isArray(t[side+'Payments'])?t[side+'Payments']:[];
const paid=(t,side)=>payments(t,side).reduce((sum,p)=>sum+num(p.amount),0);
const expected=(t,side)=>side==='client'?calc(t).price:(t.mode==='own'?0:num(t.carrierFixed)+num(t.distance)*num(t.carrierRate));
const due=(t,side)=>Math.max(0,expected(t,side)-paid(t,side));
const payLabel=(t,side)=>expected(t,side)===0?'Нет долга':due(t,side)<0.01?'Оплачено':paid(t,side)>0?'Частично':'Не оплачено';
const canClose=t=>!!t.docsReceived&&due(t,'client')<0.01&&due(t,'carrier')<0.01;

function paymentSection(side,title){const items=payments(draft,side);return '<div class="card section"><h2>'+title+'</h2><div class="line"><span>Начислено</span><strong>'+money(expected(draft,side))+'</strong></div><div class="line"><span>Оплачено</span><strong>'+money(paid(draft,side))+'</strong></div><div class="line"><span>Долг</span><strong>'+money(due(draft,side))+'</strong></div><div class="line"><span>Статус</span><strong>'+payLabel(draft,side)+'</strong></div>'+(tripEditMode||!editing?'<label>Срок оплаты<input type="date" data-field="'+side+'DueDate" value="'+esc(draft[side+'DueDate']||'')+'"></label><div class="fields"><label>Сумма оплаты, ₽<input type="text" inputmode="decimal" data-payment-amount="'+side+'" placeholder="0"></label><label>Дата оплаты<input type="date" data-payment-date="'+side+'" value="'+new Date().toISOString().slice(0,10)+'"></label></div><button class="btn secondary" data-action="add-payment" data-side="'+side+'">Добавить оплату</button>'+(items.length?'<div class="scroll"><table><thead><tr><th>Дата</th><th>Сумма</th><th></th></tr></thead><tbody>'+items.map(p=>'<tr><td>'+esc(p.date)+'</td><td>'+money(p.amount)+'</td><td><button class="btn danger" data-action="remove-payment" data-side="'+side+'" data-id="'+esc(p.id)+'">Удалить</button></td></tr>').join('')+'</tbody></table></div>' :'<p class="muted">Оплат пока нет.</p>'):'')+'</div>';}

const localISODate=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
let financePeriod='month',financeDate=localISODate(new Date());
function financeRange(){
 if(financePeriod==='all')return ['0000-01-01','9999-12-31'];
 const d=new Date(financeDate+'T12:00:00');if(Number.isNaN(d.getTime()))return ['',''];
 const fmt=localISODate;
 let start=new Date(d),end=new Date(d);
 if(financePeriod==='week'){start.setDate(d.getDate()-(d.getDay()+6)%7);end=new Date(start);end.setDate(start.getDate()+6);}
 else if(financePeriod==='month'){start.setDate(1);end=new Date(d.getFullYear(),d.getMonth()+1,0);}
 
 return [fmt(start),fmt(end)];
}
function shiftFinancePeriod(direction){const d=new Date(financeDate+'T12:00:00');if(Number.isNaN(d.getTime()))return;const day=d.getDate();if(financePeriod==='all')return;if(financePeriod==='month'){d.setDate(1);d.setMonth(d.getMonth()+direction);d.setDate(Math.min(day,new Date(d.getFullYear(),d.getMonth()+1,0).getDate()));}else{d.setDate(d.getDate()+direction*(financePeriod==='week'?7:1));}financeDate=localISODate(d);render();}

}
function dashboard(){const completed=trips.filter(t=>['Доставлен','Закрыт'].includes(normalizeStatus(t))),active=trips.filter(activeTrip);const [periodStart,periodEnd]=financeRange(),financeTrips=trips.filter(t=>typeof t.loadDate==='string'&&t.loadDate.slice(0,10)>=periodStart&&t.loadDate.slice(0,10)<=periodEnd);const sums=financeTrips.reduce((a,t)=>{const c=calc(t);a.revenue+=c.price;a.cost+=t.actualCost===''?c.cost:num(t.actualCost);return a;},{revenue:0,cost:0});const cashReceived=financeTrips.reduce((n,t)=>n+paid(t,'client'),0),cashCarrierPaid=financeTrips.reduce((n,t)=>n+paid(t,'carrier'),0),ownCosts=financeTrips.filter(t=>t.mode==='own').reduce((n,t)=>n+(t.actualCost!==''?num(t.actualCost):calc(t).cost),0),expectedProfit=sums.revenue-sums.cost,cashResult=cashReceived-cashCarrierPaid-ownCosts;const values=[['Всего рейсов',trips.length,'all'],['Активных рейсов',active.length,'active'],['Выручка',money(sums.revenue),'revenue'],['Долг заказчиков',money(trips.reduce((sum,t)=>sum+due(t,'client'),0)),'client-debt'],['Долг перевозчикам',money(trips.reduce((sum,t)=>sum+due(t,'carrier'),0)),'carrier-debt']];const max=Math.max(1,sums.revenue,sums.cost);return '<div class="top"><div><h1>Показатели</h1><p class="muted">Управление перевозками и результатами</p></div></div><div class="grid dashboard-stats">'+values.map(([l,v,filter])=>'<button type="button" class="card stat-link" data-dashboard-filter="'+filter+'" title="Открыть: '+l+'"><div class="muted">'+l+'</div><div class="value">'+v+'</div></button>').join('')+'</div><div class="two"><div class="card"><h2>Финансовые показатели</h2>'+financePeriodControls()+(trips.some(t=>!t.loadDate)?'<p class="muted" style="font-size:12px">Рейсы без даты погрузки не учитываются: '+trips.filter(t=>!t.loadDate).length+'. Укажите дату в карточке рейса.</p>':'')+'<div class="line"><span>Выручка</span><strong>'+money(sums.revenue)+'</strong></div><div class="line"><span>Расходы</span><strong>'+money(sums.cost)+'</strong></div><div class="line"><span>Плановая прибыль</span><strong class="'+(expectedProfit<0?'loss':'profit')+'">'+money(expectedProfit)+'</strong></div><div class="line"><span>Фактическая прибыль</span><strong class="'+(cashResult<0?'loss':'profit')+'">'+money(cashResult)+'</strong></div><div class="line"><span>Полностью закрыто рейсов</span><strong>'+financeTrips.filter(t=>normalizeStatus(t)==='Закрыт').length+'</strong></div><div class="chart"><div class="bar" style="height:'+Math.max(2,sums.revenue/max*100)+'%"><span>Выручка</span></div><div class="bar alt" style="height:'+Math.max(2,sums.cost/max*100)+'%"><span>Расходы</span></div></div></div><div class="card"><h2>Последние рейсы</h2>'+(trips.length?trips.slice().sort((a,b)=>b.createdAt.localeCompare(a.createdAt)).slice(0,5).map(t=>'<button type="button" class="line recent-trip" data-action="edit-trip" data-id="'+esc(t.id)+'" title="Открыть рейс"><span>'+esc(t.from)+' — '+esc(t.to)+'</span><strong>'+money(calc(t).profit)+'</strong></button>').join(''):'<p class="muted">Добавьте первый рейс, чтобы увидеть статистику.</p>')+'</div></div>';}

function warehouseBalance(x,id){return x.moves.filter(m=>m.itemId===id).reduce((n,m)=>n+(m.type==='in'?1:-1)*Number(m.quantity||0),0);}

 if(e.target.id!=='warehouse-add'&&!e.target.classList.contains('warehouse-move'))return;
 e.preventDefault();const f=e.target,x=warehouseRead(),q=warehouseNum(f.elements.quantity.value);
 if(!Number.isFinite(q)||q<0||(f.classList.contains('warehouse-move')&&q===0)){alert('Укажите корректное количество.');return;}
 if(f.id==='warehouse-add'){
  const name=f.elements.name.value.trim();if(!name){alert('Укажите наименование.');return;}
  const id=typeof crypto!=='undefined'&&crypto.randomUUID?crypto.randomUUID():String(Date.now())+'-'+Math.random();

  if(q>0)x.moves.push({itemId:id,type:'in',quantity:q,note:'Начальный остаток',date:new Date().toLocaleString('ru-RU')});

// Subscription access control (test2). Fail closed on network errors.
let transeraAccess={state:'checking',subscription:null};
async function transeraRefreshAccess(){
 const token=sessionStorage.getItem('business-ai-test2-auth-token');
 if(!token){transeraAccess={state:'checking',subscription:null};return;}
 try{
  const res=await fetch((window.BUSINESS_PLATFORM?.subscriptions||(!window.BUSINESS_PLATFORM?.sharedData?window.BUSINESS_PLATFORM?.billing:''))+'?route=%2Fsubscription',{headers:{'X-TRANSERA-Token':'Bearer '+token},signal:AbortSignal.timeout(15000),cache:'no-store'});
  if(!res.ok)throw Error('HTTP '+res.status);
  const data=await res.json();
  if(typeof data.subscription?.active!=='boolean')throw Error('Invalid subscription');
  transeraAccess={state:data.subscription.active?'active':'expired',subscription:data.subscription};
 }catch(error){transeraAccess={state:'unavailable',subscription:null};}
 // Subscription applies only at document export, never to browsing or AI.
 render();
}
function transeraAccessAllowed(){return transeraAccess.state==='active';}
function transeraLockedPage(){
 const expired=transeraAccess.state==='expired';
 const title=expired?'Срок действия подписки истёк':transeraAccess.state==='checking'?'Загружаем данные':'Не удалось проверить подписку';
 const msg=expired?'Для продолжения работы с Business AI, пожалуйста, продлите подписку или активируйте промокод в личном кабинете. Все ваши рейсы и расчёты сохранены.':transeraAccess.state==='checking'?'Подождите несколько секунд, открываем ваш кабинет.':'Для защиты аккаунта рабочие разделы временно недоступны, пока не удастся подтвердить подписку.';
 return '<div class="card section" style="max-width:640px;margin:20px auto;text-align:center"><h2>'+(transeraAccess.state==='checking'?'⏳ ':'🔒 ')+title+'</h2><p class="muted">'+msg+'</p>'+(transeraAccess.state==='checking'?'':'<div class="actions" style="justify-content:center"><button type="button" class="btn" data-page="account">Продлить подписку</button><button type="button" class="btn secondary" data-refresh-access>Проверить снова</button></div>')+'</div>';
}

// Numeric keypad: append new digits at the right edge regardless of browser caret position.
document.addEventListener('keydown',e=>{
 const el=e.target;
 if(!el.matches || !el.matches('input[data-numeric]') || e.ctrlKey || e.metaKey || e.altKey || e.isComposing)return;
 const k=e.key;
 if(!/^\\d$/.test(k) && k!=='.' && k!==',' && k!=='Backspace')return;
 e.preventDefault();
 let v=el.value;
 if(k==='Backspace')v=v.slice(0,-1);
 else if(k==='.'||k===','){if(!v.includes('.'))v=(v||'0')+'.';}
 else v=(v==='0'?k:v+k);
 el.value=v;
 el.dispatchEvent(new Event('input',{bubbles:true}));
 el.setSelectionRange(el.value.length,el.value.length);
});
document.addEventListener('input',e=>{const k=e.target.dataset.field;if(k){if(e.target.dataset.numeric){const cleaned=e.target.value.replace(/[^\d.,]/g,'').replace(',','.').replace(/^0+(?=\d)/,'');if(cleaned!==e.target.value)e.target.value=cleaned;try{e.target.setSelectionRange(e.target.value.length,e.target.value.length)}catch{}}if(draft[k]!==e.target.value)markTripChanged();draft[k]=e.target.value;if((k==='from'||k==='to')&&(page==='calculators'||tripEditor)){routeSuggest(e.target);routeAutoFill();}if(k==='manualPrice'&&draft[k]!==''&&!/^\d*\.?\d*$/.test(draft[k]))return;const live=document.getElementById('live-results');if(live)live.outerHTML=results(!tripEditor);}if(e.target.id==='trip-search'){search=e.target.value;const pos=e.target.selectionStart;render();const n=document.getElementById('trip-search');if(n){n.focus();n.setSelectionRange(pos,pos);}}});

document.addEventListener('click',async e=>{const modeButton=e.target.closest('[data-transport-mode]');if(modeButton&&(page==='calculators'||(page==='trips'&&tripEditor))){const next=modeButton.dataset.transportMode;if(next==='own'||next==='hired'){if(draft.mode!==next){markTripChanged();draft.mode=next;}render();}return;}if(e.target.closest('[data-go-home]')){await goHomeSafely();return;}if(e.target.closest('[data-go-back]')){goBack();return;}const stat=e.target.closest('[data-dashboard-filter]');if(stat){dashboardFilter=stat.dataset.dashboardFilter;statusFilter='Все';search='';tripEditor=false;setPage('trips');return;}const nav=e.target.closest('[data-page]');if(nav){dashboardFilter='';statusFilter='Все';tripEditor=false;setPage(nav.dataset.page);return;}const tab=e.target.closest('[data-tab]');if(tab){calcTab=tab.dataset.tab;render();return;}const btn=e.target.closest('[data-action]');if(!btn)return;const a=btn.dataset.action,id=btn.dataset.id;try{if(a==='clear-dashboard-filter'){dashboardFilter='';statusFilter='Все';search='';render();}else if(a==='add-payment'){const side=btn.dataset.side,amountEl=document.querySelector('[data-payment-amount="'+side+'"]'),dateEl=document.querySelector('[data-payment-date="'+side+'"]');const amount=Number((amountEl?.value||'').replace(',','.'));if(!Number.isFinite(amount)||amount<=0)return alert('Укажите положительную сумму.');if(amount>due(draft,side)+0.009)return alert('Сумма превышает остаток долга.');if(!dateEl?.value)return alert('Укажите дату оплаты.');markTripChanged();draft[side+'Payments']=[...payments(draft,side),{id:uid(),amount,date:dateEl.value}];render();}else if(a==='remove-payment'){const side=btn.dataset.side;const remaining=payments(draft,side).filter(p=>p.id!==id);if(remaining.length===payments(draft,side).length)return;markTripChanged();draft[side+'Payments']=remaining;render();}else if(a==='close-trip'){if(!editing)return alert('Сначала сохраните рейс кнопкой «Сохранить рейс».');const missing=closeReadiness(draft);if(missing.length){alert('Рейс пока нельзя закрыть. Осталось выполнить:\n'+missing.join('\n'));return;}draft.status='Закрыт';draft.closedAt=new Date().toISOString();const old=trips.find(t=>t.id===editing);await put('trips',{...draft,id:editing,number:old?.number||draft.number,createdAt:old?.createdAt||draft.createdAt});tripEditor=true;tripEditMode=false;page='trips';await refresh();}else if(a==='save-calc'){const item={...draft,id:uid(),createdAt:new Date().toISOString()};await put('calculations',item);selectedCalcId=item.id;draft={...defaults(),...item};await refresh();}else if(a==='load-calc'){const c=calculations.find(c=>c.id===id);if(!c)return;selectedCalcId=id;draft={...defaults(),...c};render();document.querySelector('.saved-calc-actions')?.scrollIntoView({behavior:'smooth',block:'nearest'});}else if(a==='trip-from-saved-calc'){const c=calculations.find(c=>c.id===id);if(!c)return;draft={...defaults(),...c};delete draft.id;delete draft.createdAt;selectedCalcId=null;editing=null;tripEditMode=true;dashboardFilter='';statusFilter='Все';tripEditor=true;page='trips';pushNavigation();render();}else if(a==='delete-calc'){{await del('calculations',id);if(selectedCalcId===id)selectedCalcId=null;await refresh();}}else if(a==='new-trip'||a==='blank-trip'){if(a==='blank-trip')draft=defaults();else{draft={...draft};delete draft.id;delete draft.number;delete draft.createdAt;}editing=null;tripEditMode=true;tripEditor=true;page='trips';pushNavigation();render();}else if(a==='edit-trip'){tripEditMode=false;const trip=trips.find(t=>String(t.id)===String(id));if(!trip)return alert('Рейс не найден.');draft={...defaults(),...trip};editing=trip.id;dashboardFilter='';statusFilter='Все';page='trips';tripEditor=true;pushNavigation();render();}else if(a==='begin-trip-edit'){tripEditMode=true;markTripChanged();render();document.querySelector('[data-field="client"]')?.focus();}else if(a==='save-trip'){if(editing&&!tripEditMode)return alert('Сначала нажмите «Внести изменения».');if(!draft.from.trim()||!draft.to.trim())return alert('Укажите пункты отправления и назначения.');if(editing&&normalizeStatus(trips.find(t=>t.id===editing)||{})==='Закрыт'&&draft.status==='Доставлен'&&canClose(draft)){draft.status='Закрыт';draft.closedAt=new Date().toISOString();}if(draft.status==='Закрыт'&&!canClose(draft))return alert('Рейс нельзя закрыть без документов и полной оплаты.');if(draft.status!=='Закрыт')delete draft.closedAt;const old=trips.find(t=>t.id===editing);const id2=editing||uid();await put('trips',{...draft,id:id2,number:old?.number||'ТР-'+String(Date.now()).slice(-8),createdAt:old?.createdAt||new Date().toISOString()});tripEditor=false;editing=null;tripEditMode=false;await refresh();}else if(a==='cancel-trip'){tripEditor=false;editing=null;render();}else if(a==='delete-trip'){{await del('trips',id);tripEditor=false;editing=null;await refresh();}}else if(a==='export'){const data=JSON.stringify({version:1,exportedAt:new Date().toISOString(),trips,calculations},null,2);const blob=new Blob([data],{type:'application/json'});const url=URL.createObjectURL(blob);const link=document.createElement('a');link.href=url;link.download='transera-backup-'+new Date().toISOString().slice(0,10)+'.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}}catch(err){alert('Ошибка сохранения: '+err.message);}});
async function importJSON(file){try{const data=JSON.parse(await file.text());if(!Array.isArray(data.trips)||!Array.isArray(data.calculations)||data.version!==1)throw Error('Неверный формат резервной копии');for(const [name,items] of [['trips',data.trips],['calculations',data.calculations]])for(const item of items){if(!item||typeof item.id!=='string'||typeof item.mode!=='string')throw Error('Некорректная запись');await put(name,item);}await refresh();alert('Импорт завершён');}catch(err){alert('Ошибка импорта: '+err.message);}}

// Test-only T-Bank payment and promo code integration.
async function subscriptionApi(route,body){
 if(!window.BUSINESS_PLATFORM?.sharedData&&window.BUSINESS_PLATFORM?.billing&&route==='/promo/redeem')return window.BUSINESS_PLATFORM_API('billing','/documents/promo/redeem',body);
 const token=sessionStorage.getItem('business-ai-test2-auth-token');
 if(!token)throw Error('Сначала войдите в аккаунт.');
 const response=await fetch(TRANSERA_PAYMENTS_URL+'?route='+encodeURIComponent(route),{
  method:body?'POST':'GET',
  headers:{'X-TRANSERA-Token':'Bearer '+token,...(body?{'Content-Type':'application/json'}:{})},
  ...(body?{body:JSON.stringify(body)}:{}),
  signal:AbortSignal.timeout(20000)
 });
 const data=await response.json().catch(()=>({}));
 if(!response.ok)throw Error(data.error||'HTTP '+response.status);
 return data;
}
