name: Browser and release checks
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    name: Identical site checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript and test-suite fingerprint
        run: node --test tests/site-contract.test.cjs
      - name: Install the tested Playwright version
        run: npm install --no-save @playwright/test@1.62.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run the complete shared browser suite
        run: |
          python3 -m http.server 8765 > /tmp/business-ai-http.log 2>&1 &
          npx playwright test --reporter=line
      - name: Preserve failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-${{ github.run_id }}
          path: test-results/
          retention-days: 7
